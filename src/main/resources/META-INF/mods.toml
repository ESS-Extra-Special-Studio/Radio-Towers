version="${mod_version}"
displayName="RadioTowers"
displayURL="https://modrinth.com/project/apocalypse-structures-radio-towers-and-airdrops"
credits="Original mod by that1lilguy — https://www.curseforge.com/members/that1lilguy/projects — (project owner; not Extra Special Studio). Dead Air integration and maintenance builds: Extra Special Studio (collaborator). Panel GUIs use ExtraSpecialCore."
