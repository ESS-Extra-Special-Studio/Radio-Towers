buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'idea'

group = mod_group_id
version = mod_version
archivesBaseName = mod_id

sourceSets {
    berezkaStub {
        java { srcDir 'src/berezkaStub/java' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mappings channel: 'official', version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(files('C:/Users/Ksivi/IdeaProjects/ESL - 1.16.5 Forge/build/libs/extraspeciallib-1.2.0+1.16.5-forge.jar'))
    implementation fg.deobf(files('C:/Users/Ksivi/IdeaProjects/ESC - 1.16.5 Forge/build/libs/extraspecialcore-2.1.0+1.16.5-forge.jar'))
    implementation fg.deobf(files('C:/Users/Ksivi/IdeaProjects/ESN - 1.16.5 Forge/build/libs/esn-1.0.2+1.16.5-forge.jar'))
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}

afterEvaluate {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    compileBerezkaStubJava.configure {
        classpath = sourceSets.main.compileClasspath
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    compileJava.dependsOn compileBerezkaStubJava
    compileJava.configure {
        classpath += sourceSets.berezkaStub.output.classesDirs
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

processResources {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
        mod_id: mod_id, mod_version: mod_version, mod_name: mod_name,
        esc_version_range: esc_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    archiveFileName = "${mod_id}-${mod_version}+${minecraft_version}-forge.jar"
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'radiotowers.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
