plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${version}+${minecraft_version}-neoforge.jar"
    from('CHANGELOG.md') {
        into '.'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    berezkaStub {
        java { srcDir 'src/berezkaStub/java' }
    }
    taczStub {
        java { srcDir 'src/taczStub/java' }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation files('C:/Users/Ksivi/IdeaProjects/ESL - 1.20.6 NeoForge/build/libs/extraspeciallib-1.2.0+1.20.6-neoforge.jar')
    implementation files('C:/Users/Ksivi/IdeaProjects/ESC - 1.20.6 NeoForge/build/libs/extraspecialcore-2.1.0+1.20.6-neoforge.jar')
    implementation files('C:/Users/Ksivi/IdeaProjects/ESN - 1.20.6 NeoForge/build/libs/esn-1.0.2+1.20.6-neoforge.jar')
}

afterEvaluate {
    compileBerezkaStubJava.configure {
        classpath = sourceSets.main.compileClasspath
    }
    compileTaczStubJava.configure {
        classpath = sourceSets.main.compileClasspath
    }
    compileJava.dependsOn compileBerezkaStubJava, compileTaczStubJava
    compileJava.configure {
        classpath += sourceSets.berezkaStub.output.classesDirs
        classpath += sourceSets.taczStub.output.classesDirs
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            esc_version_range      : esc_version_range,
            esl_version_range      : esl_version_range,
            esn_version_range      : esn_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
