buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

// Optional Berezka API: stub WavesManager for mixin AP / compile when libs/ has no API JAR (stub is not packaged in the mod).
sourceSets {
    berezkaStub {
        java { srcDir 'src/berezkaStub/java' }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { radiotowers { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { radiotowers { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf(files('C:/Users/Ksivi/IdeaProjects/ESL - 1.18.2 Forge/build/libs/extraspeciallib-1.2.0+1.18.2-forge.jar'))
    implementation fg.deobf(files('C:/Users/Ksivi/IdeaProjects/ESC - 1.18.2 Forge/build/libs/extraspecialcore-2.1.0+1.18.2-forge.jar'))
    implementation fg.deobf(files('C:/Users/Ksivi/IdeaProjects/ESN - 1.18.2 Forge/build/libs/esn-1.0.2+1.18.2-forge.jar'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

afterEvaluate {
    compileBerezkaStubJava.configure {
        classpath = sourceSets.main.compileClasspath
    }
    compileJava.dependsOn compileBerezkaStubJava
    compileJava.configure {
        classpath += sourceSets.berezkaStub.output.classesDirs
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        mod_id: mod_id, mod_version: mod_version, mod_name: mod_name,
        esc_version_range: esc_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mod_version}+${minecraft_version}-forge.jar"
    manifest {
        attributes(['Specification-Title': mod_id, 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion])
    }
    finalizedBy 'reobfJar'
}

