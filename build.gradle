plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${version}+${minecraft_version}-neoforge.jar"
    from('CHANGELOG.md') {
        into '.'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    berezkaStub {
        java { srcDir 'src/berezkaStub/java' }
    }
    taczStub {
        java { srcDir 'src/taczStub/java' }
    }
}

neoForge {
    enable {
        version = project.neo_version
        // Vineflower emits a protected override of public Named.contents() and javac rejects the Minecraft sources.
        disableRecompilation = true
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly files('C:/Users/Ksivi/IdeaProjects/ESL - 26.2 NeoForge/build/libs/extraspeciallib-1.2.0+26.2-neoforge.jar')
    compileOnly files('C:/Users/Ksivi/IdeaProjects/ESC - 26.2 NeoForge/build/libs/extraspecialcore-2.1.0+26.2-neoforge.jar')
    compileOnly files('C:/Users/Ksivi/IdeaProjects/ESN - 26.2 NeoForge/build/libs/esn-1.0.2+26.2-neoforge.jar')
}

afterEvaluate {
    compileBerezkaStubJava.configure {
        classpath = sourceSets.main.compileClasspath
    }
    compileTaczStubJava.configure {
        classpath = sourceSets.main.compileClasspath
    }
    compileJava.dependsOn compileBerezkaStubJava, compileTaczStubJava
    compileJava.configure {
        classpath += sourceSets.berezkaStub.output.classesDirs
        classpath += sourceSets.taczStub.output.classesDirs
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            esc_version_range      : esc_version_range,
            esl_version_range      : esl_version_range,
            esn_version_range      : esn_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    filteringCharset = 'UTF-8'
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('copyToNeoForgeTestPack') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def dest = file("${System.getProperty('user.home')}/curseforge/minecraft/Instances/NEOFORGE 1.21.1 TESTS/mods")
        if (dest.exists()) {
            dest.listFiles({ f -> f.name.startsWith('radiotowers-') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
            copy { from jar; into dest }
            println "Copied ${jar.name} to ${dest}"
        } else {
            println "NeoForge test pack mods folder not found: ${dest}"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
